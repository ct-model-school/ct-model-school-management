name: Mobile Hero Crop Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use cover on mobile hero
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'object-cover object-[center_58%] sm:object-center max-sm:object-contain'
          new = 'object-cover object-[center_58%] sm:object-center max-sm:object-cover'
          if old not in s:
              raise SystemExit('Target mobile hero image class not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/mobile-hero-crop-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/mobile-hero-crop-fix.yml
          git commit -m "Improve mobile hero crop"
          git push
