name: Fix SR signature layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip sr signature]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move requester name above signature line
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/member/dashboard/item-sr.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''.sig { text-align: center; padding-top: 18px; border-top: 1px solid #59616d; font-size: 8px; color: #606a77; }\n.sig .name { display: block; margin-top: 3px; font-size: 9px; font-weight: 700; color: #172033; }\n.sig .id { display: block; margin-top: 2px; font-size: 8px; font-weight: 700; color: ${themePrimary}; }\n.sig .date { display: block; margin-top: 2px; font-size: 7px; color: #687181; }'''
          new = '''.sig { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 0; border-top: 0; font-size: 0; color: #606a77; }\n.sig .name { order: 1; display: block; margin-top: 0; font-size: 9px; line-height: 1.1; font-weight: 700; color: #172033; }\n.sig .id { order: 2; display: block; margin-top: 1px; font-size: 8px; line-height: 1.1; font-weight: 700; color: ${themePrimary}; }\n.sig .date { order: 3; display: block; margin-top: 1px; font-size: 7px; line-height: 1.1; color: #687181; }\n.sig::after { order: 4; content: attr(data-label); display: block; width: 100%; margin-top: 4px; padding-top: 4px; border-top: 1px solid #59616d; font-size: 8px; line-height: 1.1; color: #606a77; }'''
          if old not in s:
              raise SystemExit('Expected signature CSS block not found')
          s = s.replace(old, new, 1)
          old_html = '''<div class="signatures">\n    <div class="sig">Prepared By<span class="name">${escapeHtml(requesterName)}</span><span class="id">ID: ${escapeHtml(requesterId)}</span><span class="date">${formatDate(requestedAt)}</span></div>\n    <div class="sig">Approved By<span class="name">${escapeHtml(approverName)}</span><span class="id">ID: ${escapeHtml(approverId)}</span><span class="date">${approvedAt ? formatDate(approvedAt) : "Pending Approval"}</span></div>\n  </div>'''
          new_html = '''<div class="signatures">\n    <div class="sig" data-label="Prepared By"><span class="name">${escapeHtml(requesterName)}</span><span class="id">ID: ${escapeHtml(requesterId)}</span><span class="date">${formatDate(requestedAt)}</span></div>\n    <div class="sig" data-label="Approved By"><span class="name">${escapeHtml(approverName)}</span><span class="id">ID: ${escapeHtml(approverId)}</span><span class="date">${approvedAt ? formatDate(approvedAt) : "Pending Approval"}</span></div>\n  </div>'''
          if old_html not in s:
              raise SystemExit('Expected signature HTML block not found')
          s = s.replace(old_html, new_html, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-sr-signature.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/member/dashboard/item-sr.tsx .github/workflows/fix-sr-signature.yml
          git commit -m 'Fix SR signature name position [skip sr signature]'
          git push
