name: Fix home community card alignment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix home community card details') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Align Read more controls
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/page.tsx')
          text = path.read_text()
          old = 'className="mt-3 text-left"'
          new = 'className="mt-auto pt-3 text-left"'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 home card detail blocks, found {count}')
          path.write_text(text.replace(old, new))
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-home-community-card.yml

      - name: Commit final change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/fix-home-community-card.yml
          git commit -m "Fix home community card details" || exit 0
          git push