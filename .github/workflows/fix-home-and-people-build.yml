name: Fix home and people build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('app/page.tsx')
          text = page.read_text()
          old = '}})}</div><div className="mt-6 text-center sm:hidden">'
          new = '})}</div><div className="mt-6 text-center sm:hidden">'
          if old not in text:
              raise SystemExit('Expected home page closing sequence was not found')
          page.write_text(text.replace(old, new, 1))

          people = Path('app/admin/people/page.tsx')
          text = people.read_text()
          old = 'function edit(x:Profile){setEditingId(x.id);setForm({...emptyForm,...x,display_order:String(x.display_order),photo_url:x.photo_url||""});setPhoto(null);window.scrollTo({top:0,behavior:"smooth"});}'
          new = '''function edit(x:Profile){setEditingId(x.id);setForm({...emptyForm,category:x.category,full_name:x.full_name,photo_url:x.photo_url||"",designation:x.designation||"",department:x.department||"",subject:x.subject||"",committee_position:x.committee_position||"",class_name:x.class_name||"",section:x.section||"",academic_year:x.academic_year||"",exam_name:x.exam_name||"",result_value:x.result_value||"",achievement_type:x.achievement_type||"",scholarship_type:x.scholarship_type||"",short_description:x.short_description||"",email:x.email||"",phone:x.phone||"",whatsapp:x.whatsapp||"",display_order:String(x.display_order)});setPhoto(null);window.scrollTo({top:0,behavior:"smooth"});}'''
          if old not in text:
              raise SystemExit('Expected people edit function was not found')
          people.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fixes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/admin/people/page.tsx .github/workflows/fix-home-and-people-build.yml
          git rm .github/workflows/fix-home-and-people-build.yml
          git commit -m "fix: repair home syntax and people admin type error"
          git push
