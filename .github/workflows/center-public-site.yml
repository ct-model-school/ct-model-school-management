name: Center public website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/center-public-site.yml'

permissions:
  contents: write

jobs:
  center-public-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Center public layout
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/globals.css')
          css = path.read_text(encoding='utf-8')

          old = '''main:has(> header + #top) {
            width: 1320px;
            min-width: 1320px;
            margin-inline: auto;
          }

          @media (max-width: 1300px) {
            main:has(> header + #top) { margin-inline: 0; }
          }'''

          new = '''main:has(> header + #top) {
            width: min(100%, 1320px);
            min-width: 0;
            max-width: 1320px;
            margin-inline: auto;
          }

          @media (max-width: 1300px) {
            main:has(> header + #top) { margin-inline: auto; }
          }'''

          if old not in css:
              raise SystemExit('Expected public layout block was not found. No changes made.')

          css = css.replace(old, new, 1)

          marker = '/* Centered public website content rail. */'
          if marker not in css:
              css += '''\n\n/* Centered public website content rail. */
          @media (min-width: 768px) {
            main:has(> header + #top) > header > div,
            main:has(> header + #top) > #top + section + section > div,
            main:has(> header + #top) > #top + section + section + section > div,
            main:has(> header + #top) #about > div,
            main:has(> header + #top) #principal > div,
            main:has(> header + #top) #contact > div,
            main:has(> header + #top) > footer > div {
              width: min(100%, 1240px);
              margin-inline: auto;
            }
          }
          '''

          path.write_text(css, encoding='utf-8')

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css
          if git diff --cached --quiet; then
            echo "No layout changes needed."
            exit 0
          fi
          git commit -m "Center public website layout"
          git push
