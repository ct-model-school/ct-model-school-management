name: Fix SR history print and theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch SR print and history
        shell: python
        run: |
          from pathlib import Path

          item_path = Path('app/member/dashboard/item-sr.tsx')
          text = item_path.read_text(encoding='utf-8')

          text = text.replace(
              'async function printSr(sr: SubmittedSr) {',
              'export async function printSr(sr: SubmittedSr) {'
          )

          text = text.replace(
              '  let live: any = null;\n  let logoUrl = "";',
              '  let live: any = null;\n  let currentUser: any = null;\n  let logoUrl = "";'
          )

          text = text.replace(
              '      live = data ?? null;\n    }\n    const { data: settings }',
              '      live = data ?? null;\n      const { data: current } = await createClient().rpc("store_get_current_user_profile", { p_token: token });\n      currentUser = current ?? null;\n    }\n    const { data: settings }'
          )

          text = text.replace(
              '  const requesterName = String(live?.requester_name || "Requester").trim();',
              '  const requesterName = String(live?.requester_name || currentUser?.full_name || "Requester").trim();'
          )
          text = text.replace(
              '  const requesterId = String(live?.requester_login_id || live?.requester_member_id || "-").trim();',
              '  const requesterId = String(live?.requester_login_id || live?.requester_member_id || currentUser?.member_id || "-").trim();'
          )

          text = text.replace(
              '  const requestedAt = live?.requested_at ? new Date(live.requested_at) : new Date();',
              '  const requestedAt = live?.requested_at ? new Date(live.requested_at) : new Date();\n  const rootStyles = getComputedStyle(document.documentElement);\n  const themePrimary = rootStyles.getPropertyValue("--school-primary").trim() || "#145b3b";\n  const themePrimarySoft = rootStyles.getPropertyValue("--school-primary-soft").trim() || "#eef6f1";\n  const themePrimaryBorder = rootStyles.getPropertyValue("--school-primary-border").trim() || "#b9d7c7";'
          )

          text = text.replace('border-bottom: 2px solid #1f6f4a;', 'border-bottom: 2px solid ${themePrimary};')
          text = text.replace('color: #145b3b;', 'color: ${themePrimary};')
          text = text.replace('background: #eef6f1;', 'background: ${themePrimarySoft};')
          text = text.replace('color: #28553f;', 'color: ${themePrimary};')
          text = text.replace('border: 1px solid #b9d7c7;', 'border: 1px solid ${themePrimaryBorder};')

          item_path.write_text(text, encoding='utf-8')

          list_path = Path('app/member/dashboard/my-sr-list.tsx')
          list_text = list_path.read_text(encoding='utf-8')
          list_text = list_text.replace(
              'import SrDetailModal from "@/components/SrDetailModal";',
              'import { printSr } from "./item-sr";'
          )
          list_text = list_text.replace(
              '  const [selectedSr, setSelectedSr] = useState<MySR | null>(null);\n',
              ''
          )
          list_text = list_text.replace(
              'onClick={() => setSelectedSr(sr)} onKeyDown={(event) => { if (event.key === "Enter" || event.key === " ") setSelectedSr(sr); }}',
              'onClick={() => void printSr({ srNumber: sr.sr_number, className: sr.class_name || "-", department: sr.department || "-", details: sr.request_details || "", itemCount: sr.items.length, totalQty: sr.items.reduce((sum, item) => sum + Number(item.requested_quantity || 0), 0), items: sr.items.map((item) => ({ id: item.item_id, item_code: item.item_code, item_name: item.item_name, item_type: item.item_type || null, specification: item.specification || null, model: item.model || null, unit: item.unit, current_stock: Number(item.current_stock || 0), stock_status: "", quantity: Number(item.requested_quantity || 0), note: item.item_note || item.note || "" })) })} onKeyDown={(event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); void printSr({ srNumber: sr.sr_number, className: sr.class_name || "-", department: sr.department || "-", details: sr.request_details || "", itemCount: sr.items.length, totalQty: sr.items.reduce((sum, item) => sum + Number(item.requested_quantity || 0), 0), items: sr.items.map((item) => ({ id: item.item_id, item_code: item.item_code, item_name: item.item_name, item_type: item.item_type || null, specification: item.specification || null, model: item.model || null, unit: item.unit, current_stock: Number(item.current_stock || 0), stock_status: "", quantity: Number(item.requested_quantity || 0), note: item.item_note || item.note || "" })) }); } }}'
          )
          list_text = list_text.replace(
              '      <SrDetailModal sr={selectedSr} open={Boolean(selectedSr)} onClose={() => setSelectedSr(null)} />\n',
              ''
          )
          list_path.write_text(list_text, encoding='utf-8')
      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/member/dashboard/item-sr.tsx app/member/dashboard/my-sr-list.tsx
          git rm .github/workflows/fix-sr-history-and-theme.yml
          git commit -m "Use unified SR print and theme-aware requester details"
          git push
