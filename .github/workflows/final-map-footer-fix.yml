name: Final map and footer fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch homepage map and footer
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')

          helper = '''function buildMapEmbedUrl(value: string | null, fallbackAddress: string) {
            const raw = clean(value);
            if (!raw) return `https://www.google.com/maps?q=${encodeURIComponent(fallbackAddress)}&z=17&output=embed`;
            if (/google\\.com\\/maps\\/embed/i.test(raw) || /[?&]output=embed(?:&|$)/i.test(raw)) return raw;
            try {
              const url = new URL(raw);
              const query = url.searchParams.get("q") || url.searchParams.get("query");
              if (query) return `https://www.google.com/maps?q=${encodeURIComponent(query)}&z=17&output=embed`;
              const coords = raw.match(/@(-?\\d+(?:\\.\\d+)?),(-?\\d+(?:\\.\\d+)?)/);
              if (coords) return `https://www.google.com/maps?q=${coords[1]},${coords[2]}&z=17&output=embed`;
            } catch {}
            return `https://www.google.com/maps?q=${encodeURIComponent(raw)}&z=17&output=embed`;
          }
          '''

          marker = 'function ContactIcon({ type }: { type: "email" | "phone" | "whatsapp" }) {'
          if 'function buildMapEmbedUrl(' not in text:
              text = text.replace(marker, helper + '\n' + marker, 1)

          old = '  const mapLink = clean(settings.google_map);\n  const mapSrc = mapLink;'
          new = '  const mapLink = clean(settings.google_map);\n  const mapSrc = buildMapEmbedUrl(mapLink, settings.address || DEFAULT_SETTINGS.address);'
          if old in text:
              text = text.replace(old, new, 1)

          old_footer = '<footer className="theme-primary-bg text-white border-t border-white/15 px-5 py-8">'
          new_footer = '<footer className="theme-primary-bg text-white border-t border-white/15 px-5 py-8" style={{ backgroundColor: "var(--school-primary)" }}>'
          text = text.replace(old_footer, new_footer, 1)

          text = text.replace('className="text-xs text-[var(--school-muted)]">{settings.address || DEFAULT_SETTINGS.address}</p>', 'className="text-xs text-white/75">{settings.address || DEFAULT_SETTINGS.address}</p>', 1)
          text = text.replace('className="text-xs text-[var(--school-muted)]">© {new Date().getFullYear()} {schoolName}. All rights reserved.</p>', 'className="text-xs text-white/75">© {new Date().getFullYear()} {schoolName}. All rights reserved.</p>', 1)
          text = text.replace('className="text-[11px] text-[var(--school-muted)]">Developed by', 'className="text-[11px] text-white/75">Developed by', 1)
          text = text.replace('className="text-[10px] text-[var(--school-muted)]/70">Digital School Management</p>', 'className="text-[10px] text-white/60">Digital School Management</p>', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet || git commit -m "fix: restore interactive map and themed blue footer"
          git rm .github/workflows/final-map-footer-fix.yml
          git commit -m "chore: remove one-time map footer workflow"
          git push
