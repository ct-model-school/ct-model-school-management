name: Fix Item SR Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix malformed escapeHtml expression
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/member/dashboard/item-sr.tsx')
          text = path.read_text(encoding='utf-8')
          start = text.index('  const escapeHtml = (value: string) =>')
          end = text.index('\n\n  const rows', start)
          replacement = '''  const escapeHtml = (value: string) =>
            value.replace(/[&<>"']/g, (char) => ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[char] ?? char));'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

      - name: Commit source fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-item-sr-build.yml
          git add app/member/dashboard/item-sr.tsx
          git commit -m "Fix Item SR build syntax [skip ci]"
          git push
