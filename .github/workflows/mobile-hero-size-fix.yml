name: Mobile Hero Size Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reduce mobile hero height only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'className="block h-auto w-full select-none opacity-0"'
          new = 'className="block h-auto w-full select-none opacity-0 max-sm:h-[clamp(120px,38vw,170px)] max-sm:object-cover"'
          if old not in s:
              raise SystemExit('Target hero placeholder class not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/mobile-hero-size-fix.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/mobile-hero-size-fix.yml
          git commit -m "Fix mobile hero banner height"
          git push
